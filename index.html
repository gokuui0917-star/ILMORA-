<!DOCTYPE html>

<style>
        .geometric-pattern {
            background-color: #faf9f4;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23064e3b' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

<body class="bg-background text-on-background min-h-screen flex flex-col geometric-pattern font-body-md overflow-x-hidden">
<!-- Note: TopNavBar and SideNavBar/BottomNavBar are suppressed as this is a linear/transactional onboarding screen. -->
<main class="flex-grow flex items-center justify-center p-container-padding relative">
<!-- Subtle Ambient Glow -->
<div class="absolute inset-0 overflow-hidden pointer-events-none flex justify-center items-center">
<div class="w-[80vw] h-[80vw] max-w-[800px] max-h-[800px] bg-primary/5 rounded-full blur-[100px] opacity-70"></div>
<div class="w-[60vw] h-[60vw] max-w-[600px] max-h-[600px] bg-tertiary/5 rounded-full blur-[80px] opacity-60 absolute top-1/4 right-1/4"></div>
</div>
<div class="w-full max-w-4xl grid md:grid-cols-2 gap-section-gap items-center z-10">
<!-- Left Column: Intro & Brand -->
<div class="flex flex-col space-y-8 text-center md:text-left fade-in-up">
<div class="space-y-4">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tight">
                        ILMORA
                    </h1>
<p class="font-headline-sm text-headline-sm text-tertiary-container">
                        Faith. Knowledge. Growth.
                    </p>
</div>
<div class="space-y-6 max-w-md mx-auto md:mx-0">
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                        A seamless bridge between traditional scholarship and modern digital efficiency. Discover your spiritual companion and elevate your Madrasa experience.
                    </p>
<div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start pt-4">
<button onclick="window.location.href='home.html'" class="bg-primary text-on-primary hover:bg-primary-container transition-colors duration-300 px-8 py-4 rounded-lg font-body-lg text-body-lg shadow-[0px_4px_20px_rgba(6,78,59,0.08)]">
                            Get Started
                        </button>
<button onclick="window.location.href='home.html'" class="bg-transparent border border-primary text-primary hover:bg-primary/5 transition-colors duration-300 px-8 py-4 rounded-lg font-body-lg text-body-lg">
                            Login
                        </button>
</div>
</div>
</div>
<!-- Right Column: Role Selection -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-8 shadow-[0px_12px_32px_rgba(6,78,59,0.04)] fade-in-up delay-200">
<div class="text-center mb-8 space-y-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Select Your Path</h2>
<p class="font-body-md text-body-md text-on-surface-variant">How will you use ILMORA today?</p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Role: Muslim User -->
<button onclick="window.location.href='home.html'" class="flex flex-col items-center justify-center p-6 bg-surface hover:bg-surface-container transition-colors duration-200 border border-transparent hover:border-primary/20 rounded-lg group text-center fade-in-up delay-300">
<span class="material-symbols-outlined text-4xl text-primary/70 group-hover:text-primary transition-colors mb-3" style="font-variation-settings: 'FILL' 0;">
                            mosque
                        </span>
<span class="font-body-lg text-body-lg font-medium text-on-surface">Spiritual User</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">Personal Growth</span>
</button>
<!-- Role: Student -->
<button onclick="window.location.href='student-dashboard.html'" class="flex flex-col items-center justify-center p-6 bg-surface hover:bg-surface-container transition-colors duration-200 border border-transparent hover:border-primary/20 rounded-lg group text-center fade-in-up delay-400">
<span class="material-symbols-outlined text-4xl text-primary/70 group-hover:text-primary transition-colors mb-3" style="font-variation-settings: 'FILL' 0;">
                            menu_book
                        </span>
<span class="font-body-lg text-body-lg font-medium text-on-surface">Student</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">Madrasa Learner</span>
</button>
<!-- Role: Teacher -->
<button onclick="window.location.href='home.html'" class="flex flex-col items-center justify-center p-6 bg-surface hover:bg-surface-container transition-colors duration-200 border border-transparent hover:border-primary/20 rounded-lg group text-center fade-in-up delay-500">
<span class="material-symbols-outlined text-4xl text-primary/70 group-hover:text-primary transition-colors mb-3" style="font-variation-settings: 'FILL' 0;">
                            history_edu
                        </span>
<span class="font-body-lg text-body-lg font-medium text-on-surface">Teacher</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">Educator</span>
</button>
<!-- Role: Parent -->
<button onclick="window.location.href='home.html'" class="flex flex-col items-center justify-center p-6 bg-surface hover:bg-surface-container transition-colors duration-200 border border-transparent hover:border-primary/20 rounded-lg group text-center fade-in-up delay-[600ms]">
<span class="material-symbols-outlined text-4xl text-primary/70 group-hover:text-primary transition-colors mb-3" style="font-variation-settings: 'FILL' 0;">
                            family_restroom
                        </span>
<span class="font-body-lg text-body-lg font-medium text-on-surface">Parent</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">Guardian</span>
</button>
<!-- Role: Admin (Spans full width on mobile, half on larger if needed, but keeping grid is cleaner. Let's make it span 2 cols to anchor the bottom) -->
<button onclick="window.location.href='home.html'" class="sm:col-span-2 flex flex-row items-center justify-center p-4 bg-surface hover:bg-surface-container transition-colors duration-200 border border-transparent hover:border-primary/20 rounded-lg group text-center fade-in-up delay-[700ms] mt-2">
<span class="material-symbols-outlined text-2xl text-tertiary-container group-hover:text-tertiary transition-colors mr-3" style="font-variation-settings: 'FILL' 0;">
                            admin_panel_settings
                        </span>
<div class="text-left flex flex-col justify-center">
<span class="font-body-md text-body-md font-medium text-on-surface">Madrasa Admin</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Institute Management</span>
</div>
</button>
</div>
</div>
</div>
</main>
<script>
        // Simple script to add interactivity to role selection
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                // Add a subtle click effect
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
            });
        });
    </script>
</body></html>
